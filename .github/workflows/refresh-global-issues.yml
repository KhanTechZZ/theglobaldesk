name: Refresh global issue coverage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-global-issues.yml
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect global news search trends
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const markets = [
            { geo: 'BD', name: 'Bangladesh' }, { geo: 'IN', name: 'India' }, { geo: 'PK', name: 'Pakistan' },
            { geo: 'ID', name: 'Indonesia' }, { geo: 'SG', name: 'Singapore' }, { geo: 'TH', name: 'Thailand' },
            { geo: 'PH', name: 'Philippines' }, { geo: 'JP', name: 'Japan' }, { geo: 'KR', name: 'South Korea' },
            { geo: 'AU', name: 'Australia' }, { geo: 'NZ', name: 'New Zealand' },
            { geo: 'US', name: 'United States' }, { geo: 'CA', name: 'Canada' }, { geo: 'MX', name: 'Mexico' },
            { geo: 'BR', name: 'Brazil' }, { geo: 'AR', name: 'Argentina' }, { geo: 'CL', name: 'Chile' }, { geo: 'CO', name: 'Colombia' },
            { geo: 'GB', name: 'United Kingdom' }, { geo: 'IE', name: 'Ireland' }, { geo: 'FR', name: 'France' },
            { geo: 'DE', name: 'Germany' }, { geo: 'ES', name: 'Spain' }, { geo: 'IT', name: 'Italy' },
            { geo: 'NL', name: 'Netherlands' }, { geo: 'PL', name: 'Poland' }, { geo: 'SE', name: 'Sweden' },
            { geo: 'UA', name: 'Ukraine' }, { geo: 'RU', name: 'Russia' }, { geo: 'TR', name: 'Türkiye' },
            { geo: 'SA', name: 'Saudi Arabia' }, { geo: 'AE', name: 'United Arab Emirates' }, { geo: 'EG', name: 'Egypt' },
            { geo: 'NG', name: 'Nigeria' }, { geo: 'KE', name: 'Kenya' }, { geo: 'GH', name: 'Ghana' }, { geo: 'ZA', name: 'South Africa' }
          ];
          const excluded = /\b(song|songs|album|lyrics|singer|concert|music video|celebrity|celebrities|actor|actress|movie|movies|film|films|reality show|tv show|television|streaming|series|episode|gossip|influencer|viral challenge|meme|horoscope|astrology|grammy|oscar|emmy|tabii|trt1|netflix|hulu|telenovela)\b/i;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const decode = value => String(value || '')
            .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
            .replace(/&#x([\da-f]+);/gi, (_, code) => String.fromCodePoint(parseInt(code, 16)))
            .replace(/&#(\d+);/g, (_, code) => String.fromCodePoint(parseInt(code, 10)))
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
            .replace(/&apos;/g, "'").replace(/&amp;/g, '&').replace(/<[^>]*>/g, '').trim();
          const tag = (xml, name) => {
            const match = xml.match(new RegExp(`<(?:(?:\\w+):)?${name}\\b[^>]*>([\\s\\S]*?)<\\/(?:(?:\\w+):)?${name}\\s*>`, 'i'));
            return match ? decode(match[1]) : '';
          };
          const trafficNumber = value => {
            const match = value.replace(/,/g, '').match(/([\d.]+)\s*([KMB])?\+?/i);
            if (!match) return 0;
            const multiplier = { K: 1e3, M: 1e6, B: 1e9 }[String(match[2] || '').toUpperCase()] || 1;
            return Math.floor(Number(match[1]) * multiplier);
          };
          const candidates = new Map();
          for (let marketIndex = 0; marketIndex < markets.length; marketIndex++) {
            const market = markets[marketIndex];
            try {
              const response = await fetch(`https://trends.google.com/trending/rss?geo=${market.geo}`, {
                headers: { Accept: 'application/rss+xml, application/xml, text/xml', 'User-Agent': 'TheGlobalDesk/1.0 (+https://thegdesk.com/)' },
                signal: AbortSignal.timeout(12000)
              });
              if (!response.ok) throw new Error(`Search trend feed returned ${response.status}`);
              const xml = await response.text();
              const items = [...xml.matchAll(/<item\b[^>]*>([\s\S]*?)<\/item>/gi)];
              for (const [, item] of items) {
                const title = tag(item, 'title');
                const newsTitles = [...item.matchAll(/<(?:\w+:)?news_item\b[^>]*>([\s\S]*?)<\/(?:\w+:)?news_item>/gi)].map(match => tag(match[1], 'news_item_title'));
                const signals = [title, ...newsTitles].join(' ');
                const volume = trafficNumber(tag(item, 'approx_traffic'));
                if (!title || !volume || !newsTitles.length || excluded.test(signals)) continue;
                const key = title.normalize('NFKC').toLocaleLowerCase('en').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
                if (!key) continue;
                if (!candidates.has(key)) candidates.set(key, { title, markets: new Map(), url: `https://news.google.com/search?q=${encodeURIComponent(title)}` });
                const candidate = candidates.get(key);
                candidate.markets.set(market.name, Math.max(candidate.markets.get(market.name) || 0, volume));
              }
            } catch (error) {
              console.error(`${market.name} feed: ${error.message}`);
            }
            if (marketIndex < markets.length - 1) await sleep(1200);
          }
          const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
          const topics = [...candidates.values()].map(candidate => {
            const total = [...candidate.markets.values()].reduce((sum, value) => sum + value, 0);
            return {
              title: candidate.title,
              volume: `${compact.format(total)}+ searches`,
              markets: [...candidate.markets.entries()].sort((a, b) => b[1] - a[1]).map(([name]) => name),
              marketVolumes: Object.fromEntries(candidate.markets),
              marketCount: candidate.markets.size,
              url: candidate.url,
              sortVolume: total
            };
          }).filter(topic => topic.sortVolume > 0).sort((a, b) => b.sortVolume - a.sortVolume).map(({ sortVolume, ...topic }) => topic);
          const data = {
            scope: 'Global news search activity',
            metric: 'Approximate Google Trends traffic summed across 37 markets over the past 24 hours; entertainment searches filtered',
            sourcesAvailable: markets.map(market => market.name),
            updatedAt: new Date().toISOString(),
            refreshAfterSeconds: 43200,
            topics
          };
          await fs.writeFile('data/trending.json', JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Publish updated trend data
        run: |
          if ! git diff --quiet -- data/trending.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/trending.json
            git commit -m "Refresh global issue coverage data"
            git push origin HEAD:main
          fi
