name: Refresh global issue coverage

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect serious issue search volumes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const markets = [
            { geo: 'BD', name: 'Bangladesh' }, { geo: 'IN', name: 'India' },
            { geo: 'US', name: 'United States' }, { geo: 'GB', name: 'United Kingdom' },
            { geo: 'BR', name: 'Brazil' }, { geo: 'JP', name: 'Japan' },
            { geo: 'AU', name: 'Australia' }, { geo: 'DE', name: 'Germany' },
            { geo: 'ZA', name: 'South Africa' }, { geo: 'NG', name: 'Nigeria' }
          ];
          const issues = [
            { title: 'Climate crisis', pattern: /climate change|global warming|climate crisis|carbon emissions|cop\d{2}/i },
            { title: 'Israel–Palestine war', pattern: /palestin|gaza|hamas|west bank|israel-hamas/i },
            { title: 'Russia–Ukraine war', pattern: /ukraine|russia.{0,24}ukraine|russian invasion|zelensky|kyiv/i }
          ];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const decode = value => String(value || '')
            .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
            .replace(/&#x([\da-f]+);/gi, (_, code) => String.fromCodePoint(parseInt(code, 16)))
            .replace(/&#(\d+);/g, (_, code) => String.fromCodePoint(parseInt(code, 10)))
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
            .replace(/&apos;/g, "'").replace(/&amp;/g, '&').replace(/<[^>]*>/g, '').trim();
          const tag = (xml, name) => {
            const match = xml.match(new RegExp(`<(?:(?:\\w+):)?${name}\\b[^>]*>([\\s\\S]*?)<\\/(?:(?:\\w+):)?${name}\\s*>`, 'i'));
            return match ? decode(match[1]) : '';
          };
          const trafficNumber = value => {
            const match = value.replace(/,/g, '').match(/([\d.]+)\s*([KMB])?\+?/i);
            if (!match) return 0;
            const multiplier = { K: 1e3, M: 1e6, B: 1e9 }[String(match[2] || '').toUpperCase()] || 1;
            return Math.floor(Number(match[1]) * multiplier);
          };
          const byIssue = new Map(issues.map(issue => [issue.title, new Map()]));
          for (let marketIndex = 0; marketIndex < markets.length; marketIndex++) {
            const market = markets[marketIndex];
            try {
              const response = await fetch(`https://trends.google.com/trending/rss?geo=${market.geo}`, {
                headers: { Accept: 'application/rss+xml, application/xml, text/xml', 'User-Agent': 'TheGlobalDesk/1.0 (+https://thegdesk.com/)' },
                signal: AbortSignal.timeout(12000)
              });
              if (!response.ok) throw new Error(`Search trend feed returned ${response.status}`);
              const xml = await response.text();
              const items = [...xml.matchAll(/<item\b[^>]*>([\s\S]*?)<\/item>/gi)];
              for (const [, item] of items) {
                const title = tag(item, 'title');
                const signals = [title, ...[...item.matchAll(/<(?:\w+:)?news_item\b[^>]*>([\s\S]*?)<\/(?:\w+:)?news_item>/gi)].map(match => tag(match[1], 'news_item_title'))].join(' ');
                const volume = trafficNumber(tag(item, 'approx_traffic'));
                if (!volume) continue;
                for (const issue of issues) {
                  if (!issue.pattern.test(signals)) continue;
                  const countryValues = byIssue.get(issue.title);
                  countryValues.set(market.name, Math.max(countryValues.get(market.name) || 0, volume));
                }
              }
            } catch (error) {
              console.error(`${market.name} feed: ${error.message}`);
            }
            if (marketIndex < markets.length - 1) await sleep(1200);
          }
          const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
          const topics = issues.map(issue => {
            const countryValues = byIssue.get(issue.title);
            const total = [...countryValues.values()].reduce((sum, value) => sum + value, 0);
            if (!total) return null;
            return {
              title: issue.title,
              source: 'Approximate search volume',
              volume: `${compact.format(total)}+ searches`,
              detail: 'Past 24 hours · lower bound across monitored countries',
              markets: [...countryValues.keys()],
              url: `https://news.google.com/search?q=${encodeURIComponent(issue.title)}`
            };
          }).filter(Boolean);
          const data = {
            scope: 'Global issue search activity',
            metric: 'Approximate Google search traffic summed across 10 markets; bucket values are lower bounds, over the past 24 hours',
            sourcesAvailable: markets.map(market => market.name),
            updatedAt: new Date().toISOString(),
            refreshAfterSeconds: 43200,
            topics
          };
          await fs.writeFile('data/trending.json', JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Publish updated trend data
        run: |
          if ! git diff --quiet -- data/trending.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/trending.json
            git commit -m "Refresh global issue coverage data"
            git push origin HEAD:main
          fi
