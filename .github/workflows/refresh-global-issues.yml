name: Refresh global issue coverage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-global-issues.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect all live Google Trends topics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const markets = [
            { geo: 'BD', name: 'Bangladesh' }, { geo: 'IN', name: 'India' }, { geo: 'PK', name: 'Pakistan' },
            { geo: 'ID', name: 'Indonesia' }, { geo: 'SG', name: 'Singapore' }, { geo: 'TH', name: 'Thailand' },
            { geo: 'PH', name: 'Philippines' }, { geo: 'JP', name: 'Japan' }, { geo: 'KR', name: 'South Korea' },
            { geo: 'AU', name: 'Australia' }, { geo: 'NZ', name: 'New Zealand' },
            { geo: 'US', name: 'United States' }, { geo: 'CA', name: 'Canada' }, { geo: 'MX', name: 'Mexico' },
            { geo: 'BR', name: 'Brazil' }, { geo: 'AR', name: 'Argentina' }, { geo: 'CL', name: 'Chile' }, { geo: 'CO', name: 'Colombia' },
            { geo: 'GB', name: 'United Kingdom' }, { geo: 'IE', name: 'Ireland' }, { geo: 'FR', name: 'France' },
            { geo: 'DE', name: 'Germany' }, { geo: 'ES', name: 'Spain' }, { geo: 'IT', name: 'Italy' },
            { geo: 'NL', name: 'Netherlands' }, { geo: 'PL', name: 'Poland' }, { geo: 'SE', name: 'Sweden' },
            { geo: 'UA', name: 'Ukraine' }, { geo: 'RU', name: 'Russia' }, { geo: 'TR', name: 'Türkiye' },
            { geo: 'SA', name: 'Saudi Arabia' }, { geo: 'AE', name: 'United Arab Emirates' }, { geo: 'EG', name: 'Egypt' },
            { geo: 'NG', name: 'Nigeria' }, { geo: 'KE', name: 'Kenya' }, { geo: 'GH', name: 'Ghana' }, { geo: 'ZA', name: 'South Africa' }
          ];
          const categories = [
            ['Global conflicts', /\b(war|conflict|invasion|attack|airstrike|ceasefire|hostage|military|refugee|sanction|nuclear|palestin|gaza|ukraine|russia|iran|israel|sudan|myanmar|congo|yemen|haiti|lebanon|syria|afghanistan|taiwan|hamas|hezbollah|houthi|taliban)\b/i],
            ['Politics & elections', /\b(election|president|government|parliament|prime minister|vote|voting|politic|senate|congress|minister|policy|trump|putin|zelensky|netanyahu|biden|xi jinping|united nations|campaign|ballot|political party)\b/i],
            ['Economy & business', /\b(economy|inflation|stock market|stocks|bull market|currency|debt|gold|silver|oil|trade|tariff|interest rate|jobs|bank|business|price|market|bitcoin|nasdaq|shares|finance|company|earnings|crypto)\b/i],
            ['Weather & disasters', /\b(climate|global warming|weather|heatwave|earthquake|flood|storm|cyclone|hurricane|wildfire|drought|typhoon|tsunami|disaster|rainfall|monsoon|tornado|volcano)\b/i],
            ['Health & medicine', /\b(health|disease|virus|coronavirus|covid|outbreak|vaccine|hospital|epidemic|pandemic|medicine|symptom|cancer|flu|medical)\b/i],
            ['Technology & AI', /\b(artificial intelligence|\bai\b|cyberattack|cybersecurity|technology|tech|iphone|android|smartphone|software|app|chatgpt|google|microsoft|apple|samsung|openai|gaming)\b/i],
            ['Science & space', /\b(space|spacex|nasa|scientist|science|robot|research|mission|telescope|astronomy|satellite|mars|moon landing)\b/i],
            ['Sports', /\b(sport|football|soccer|cricket|basketball|tennis|rugby|baseball|hockey|volleyball|golf|boxing|wrestling|olympics?|fifa|uefa|nba|nfl|ipl|league|cup|score|match|club|tournament| vs )\b/i],
            ['Entertainment & culture', /\b(music|song|film|movie|actor|actress|singer|celebrity|tv show|series|concert|grammy|oscar|netflix|artist|book|festival|album|drama|streaming)\b/i],
            ['Education & exams', /\b(education|school|university|college|exam|test results|admission|scholarship|curriculum|teacher|student|graduation|semester)\b/i],
            ['Law & justice', /\b(court|judge|law|legal|crime|arrest|trial|verdict|case|justice|police|lawsuit|sentence|prosecutor)\b/i],
            ['Public figures', /\b(king charles|pope francis|elon musk|taylor swift|kim kardashian|cristiano ronaldo|lionel messi|lebron james|mrbeast)\b/i],
            ['Companies & products', /\b(brand|product|launch|release date|tesla|toyota|amazon|walmart|playstation|xbox|nintendo|airline|fashion|sale)\b/i],
            ['Travel & places', /\b(travel|flight|airport|visa|tourism|hotel|holiday|vacation|travel advisory|train strike|destination)\b/i],
            ['Food & lifestyle', /\b(food|recipe|restaurant|diet|cooking|fashion|beauty|fitness|relationship|horoscope|lifestyle|wedding)\b/i],
            ['Religion & faith', /\b(religion|prayer|church|mosque|bible|quran|ramadan|eid|faith|pope|pilgrimage|christmas|diwali)\b/i],
            ['Social issues', /\b(immigration|housing|poverty|human rights|strike|protest|community|minimum wage|social security|homelessness)\b/i]
          ];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const candidates = new Map();

          async function fetchMarket(market) {
            let response;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                response = await fetch(`https://trends.google.com/trending?geo=${market.geo}&hours=24`, {
                  headers: { Accept: 'text/html', 'User-Agent': 'Mozilla/5.0 (compatible; TheGlobalDesk/1.0; +https://thegdesk.com/)' },
                  signal: AbortSignal.timeout(30000)
                });
                if (response.ok) break;
                throw new Error(`Google Trends returned ${response.status}`);
              } catch (error) {
                if (attempt === 2) throw error;
                await sleep(800 * (attempt + 1));
              }
            }
            const html = await response.text();
            const payloadMatch = html.match(/AF_initDataCallback\(\{key: 'ds:0', hash: '[^']+', data:(.*?), sideChannel: \{\}\}\);/s);
            if (!payloadMatch) throw new Error('Google Trends topic data was not found on the page');
            const payload = JSON.parse(payloadMatch[1]);
            const rows = Array.isArray(payload?.[1]) ? payload[1] : [];
            if (!rows.length) throw new Error('Google Trends returned no topics');

            for (const row of rows) {
              const title = String(row?.[0] || '').trim();
              const volume = Number(row?.[6]) || 0;
              const start = Number(row?.[3]?.[0]) || 0;
              const end = Number(row?.[4]?.[0]) || 0;
              const growth = Number(row?.[8]) || 0;
              if (!title || !volume) continue;
              const key = title.normalize('NFKC').toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
              if (!key) continue;
              if (!candidates.has(key)) candidates.set(key, {
                title,
                markets: new Map(),
                marketStartedAt: new Map(),
                marketEndedAt: new Map(),
                marketGrowth: new Map(),
                breakdown: new Set(),
                marketBreakdown: new Map()
              });
              const candidate = candidates.get(key);
              candidate.markets.set(market.name, Math.max(candidate.markets.get(market.name) || 0, volume));
              if (start) candidate.marketStartedAt.set(market.name, Math.min(candidate.marketStartedAt.get(market.name) || Infinity, start * 1000));
              if (end) candidate.marketEndedAt.set(market.name, end * 1000);
              else candidate.marketEndedAt.delete(market.name);
              candidate.marketGrowth.set(market.name, Math.max(candidate.marketGrowth.get(market.name) || 0, growth));
              const marketBreakdown = [];
              for (const related of Array.isArray(row?.[9]) ? row[9] : []) {
                const value = String(related || '').trim();
                if (value && value.normalize('NFKC').toLowerCase() !== title.normalize('NFKC').toLowerCase()) {
                  candidate.breakdown.add(value);
                  if (!marketBreakdown.some(item => item.normalize('NFKC').toLowerCase() === value.normalize('NFKC').toLowerCase())) marketBreakdown.push(value);
                }
              }
              candidate.marketBreakdown.set(market.name, marketBreakdown);
            }
            console.log(`${market.name}: indexed ${rows.length} Google Trends topics`);
          }

          let nextMarket = 0;
          const workers = Array.from({ length: 5 }, async () => {
            while (nextMarket < markets.length) {
              const market = markets[nextMarket++];
              try {
                await fetchMarket(market);
              } catch (error) {
                console.error(`${market.name}: ${error.message}`);
              }
              await sleep(500);
            }
          });
          await Promise.all(workers);

          const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
          const topics = [...candidates.values()].map(candidate => {
            const total = [...candidate.markets.values()].reduce((sum, value) => sum + value, 0);
            const category = (categories.find(([, pattern]) => pattern.test(candidate.title)) || ['Other trending searches'])[0];
            const starts = [...candidate.marketStartedAt.values()];
            const active = candidate.markets.size > [...candidate.marketEndedAt.keys()].length;
            return {
              title: candidate.title,
              category,
              volume: `${compact.format(total)}+ searches`,
              volumeValue: total,
              startedAt: starts.length ? new Date(Math.min(...starts)).toISOString() : null,
              active,
              growth: Math.max(0, ...candidate.marketGrowth.values()),
              marketStartedAt: Object.fromEntries([...candidate.marketStartedAt].map(([name, value]) => [name, new Date(value).toISOString()])),
              marketEndedAt: Object.fromEntries([...candidate.marketEndedAt].map(([name, value]) => [name, new Date(value).toISOString()])),
              marketGrowth: Object.fromEntries(candidate.marketGrowth),
              breakdown: [...candidate.breakdown],
              marketBreakdown: Object.fromEntries(candidate.marketBreakdown),
              markets: [...candidate.markets.entries()].sort((a, b) => b[1] - a[1]).map(([name]) => name),
              marketVolumes: Object.fromEntries(candidate.markets),
              marketCount: candidate.markets.size,
              sortVolume: total
            };
          }).sort((a, b) => b.sortVolume - a.sortVolume).map(({ sortVolume, ...topic }) => topic);

          const data = {
            scope: 'Google Trends Trending Now · past 24 hours',
            metric: 'All available trending topics from Google Trends across 37 country pages. Search volumes are Google estimates summed for topics appearing in multiple markets.',
            sourcesAvailable: markets.map(market => market.name),
            updatedAt: new Date().toISOString(),
            refreshAfterSeconds: 3600,
            topics
          };
          await fs.writeFile('data/trending.json', JSON.stringify(data, null, 2) + '\n');
          console.log(`Published ${topics.length} unique live search topics`);
          NODE

      - name: Publish updated trend data
        run: |
          if ! git diff --quiet -- data/trending.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/trending.json
            git commit -m "Refresh global issue coverage data"
            git push origin HEAD:main
          fi
