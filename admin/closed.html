<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071426">
  <title>Page Not Available</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 20px 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #f4f7fc;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(31, 78, 130, 0.25), transparent 55%),
        linear-gradient(145deg, #071426 0%, #0b1c32 55%, #06101e 100%);
      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 620px;
      margin: auto;
    }

    .brand {
      margin-bottom: 45px;
    }

    .brand img {
      display: block;
      width: min(270px, 78vw);
      max-height: 115px;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.25));
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 16px;
      margin-bottom: 25px;
      border: 1px solid rgba(69, 211, 151, 0.25);
      border-radius: 30px;
      background: rgba(35, 168, 112, 0.10);
      color: #75e0b1;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #45d397;
      box-shadow: 0 0 10px rgba(69, 211, 151, 0.7);
    }

    h1 {
      margin-bottom: 15px;
      font-size: clamp(32px, 6vw, 46px);
      line-height: 1.12;
      letter-spacing: -1.5px;
      font-weight: 750;
    }

    .description {
      max-width: 440px;
      margin: 0 auto 30px;
      color: #aab9cc;
      font-size: 15px;
      line-height: 1.8;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 49px;
      padding: 0 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 7px;
      background: #eaf1fa;
      color: #0a1b30;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .home-button:hover {
      background: #ffffff;
      transform: translateY(-2px);
    }

    footer {
      width: 100%;
      padding-top: 22px;
      margin-top: 55px;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      color: #718198;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    @media (max-width: 480px) {
      .brand {
        margin-bottom: 38px;
      }

      .brand img {
        width: min(235px, 76vw);
      }

      .description {
        font-size: 14px;
      }

      footer {
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="brand">
      <img src="/Logo.png" alt="The Global Desk">
    </header>

    <div class="status">
      <span class="status-dot"></span>
      Website Operational
    </div>

    <h1>Page Not Available</h1>

    <p class="description">
      This page is unavailable or may have been moved.
      Please visit our homepage for the latest news.
    </p>

    <a class="home-button" href="/">
      Visit Homepage
    </a>
  </main>

  <footer>
    &copy; 2026 The Global Desk. All rights reserved.
  </footer>
</body>
</html>
