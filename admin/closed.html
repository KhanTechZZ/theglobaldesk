<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page Not Available | The Global Desk</title>
<link rel="icon" href="/Logo.png">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 78% 42%,rgba(0,91,165,.20),transparent 48%),
    radial-gradient(ellipse at 10% 50%,rgba(0,61,125,.25),transparent 45%),
    linear-gradient(135deg,#020d20,#031a35 55%,#020d20);
  color:#f4f7ff;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  flex-direction:column;
}
header{
  min-height:100px;
  padding:18px 5%;
  display:flex;
  align-items:center;
  border-bottom:1px solid rgba(100,170,230,.22);
}
.brand{display:flex;align-items:center;gap:15px}
.brand img{width:68px;height:68px;object-fit:contain}
.brand-name{
  font-family:Georgia,serif;
  font-size:clamp(23px,3vw,35px);
  font-weight:bold;
}
.tagline{
  color:#8fb5db;
  font-size:11px;
  letter-spacing:3px;
  margin-top:6px;
}
main{
  flex:1;
  min-height:570px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 20px;
  position:relative;
  overflow:hidden;
}
main:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.17;
  background-image:radial-gradient(#3285c5 1px,transparent 1.5px);
  background-size:13px 13px;
  mask-image:radial-gradient(ellipse at center,#000 5%,transparent 75%);
  pointer-events:none;
}
.content{position:relative;z-index:1;max-width:850px}
.hero-logo{
  width:85px;height:85px;object-fit:contain;
  vertical-align:middle;margin-right:16px;
}
.hero-brand{
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:clamp(25px,4vw,43px);
  margin-bottom:25px;
}
.status{
  display:inline-flex;align-items:center;gap:9px;
  color:#54e9ad;background:rgba(0,120,105,.16);
  border:1px solid rgba(50,220,170,.22);
  padding:10px 18px;border-radius:30px;
  font-size:14px;margin-bottom:36px;
}
.dot{width:10px;height:10px;background:#35e6a1;border-radius:50%}
h1{
  font-family:Georgia,serif;
  font-size:clamp(39px,6vw,68px);
  line-height:1.12;margin:0 0 25px;
  color:#fff;
}
.description{
  color:#b7cde6;font-size:clamp(16px,2vw,21px);
  line-height:1.8;margin:0 auto 38px;
}
.home-btn{
  display:inline-flex;align-items:center;gap:13px;
  padding:17px 28px;border-radius:10px;
  border:1px solid #328bff;
  color:#fff;text-decoration:none;
  background:linear-gradient(120deg,#064b99,#07336b);
  font-size:17px;font-weight:bold;
  transition:.2s;
  box-shadow:0 8px 30px rgba(0,80,170,.18);
}
.home-btn:hover{
  background:linear-gradient(120deg,#0965c5,#08478d);
  transform:translateY(-2px);
}
footer{
  min-height:95px;padding:20px 5%;
  border-top:1px solid rgba(100,170,230,.22);
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;color:#8fb5db;
}
.footer-brand{display:flex;align-items:center;gap:10px}
.footer-brand img{width:43px;height:43px;object-fit:contain}
.footer-brand strong{font-family:Georgia,serif;color:#fff;font-size:19px}
.footer-tagline{font-size:11px;letter-spacing:2px}
@media(max-width:600px){
  header{min-height:80px;padding:12px 5%}
  .brand img{width:52px;height:52px}
  .tagline{font-size:9px;letter-spacing:1.5px}
  main{min-height:520px;padding:55px 18px}
  .hero-logo{width:62px;height:62px;margin-right:9px}
  .status{margin-bottom:28px}
  .description{line-height:1.65}
  .home-btn{padding:15px 19px;font-size:15px}
  footer{justify-content:center;text-align:center}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/Logo.png" alt="The Global Desk Logo">
    <div>
      <div class="brand-name">The Global Desk</div>
      <div class="tagline">WORLD NEWS. A CLOSER LOOK.</div>
    </div>
  </div>
</header>

<main>
  <div class="content">
    <div class="hero-brand">
      <img class="hero-logo" src="/Logo.png" alt="">
      <span>The Global Desk</span>
    </div>
    <div class="status"><span class="dot"></span> Website Operational</div>
    <h1>Page Not Available</h1>
    <p class="description">
      This page is unavailable or may have been moved.<br>
      Please visit our homepage for the latest news.
    </p>
    <a class="home-btn" href="https://thegdesk.com/">
      <span>⌂</span> Visit The Global Desk <span>→</span>
    </a>
  </div>
</main>

<footer>
  <div class="footer-brand">
    <img src="/Logo.png" alt="">
    <strong>The Global Desk</strong>
  </div>
  <div class="footer-tagline">WORLD NEWS. A CLOSER LOOK.</div>
</footer>
</body>
</html>
