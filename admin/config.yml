backend:
  name: github
  repo: KhanTechZZ/theglobaldesk
  branch: main
  base_url: https://tgdnews.pages.dev
  auth_endpoint: /api/auth

logo_url: "https://tgdnews.pages.dev/Logo.png"
locale: 'en'
publish_mode: simple

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "news"
    label: "News Articles"
    label_singular: "News Article"
    folder: "news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title (Headline)", name: "title", widget: "string", hint: "Short, clear headline (60-80 chars)." }
      - { label: "Category", name: "category", widget: "select", options: ["World", "Asia", "Explainer", "Politics", "Economy", "Tech and AI", "Science", "Environment", "Research", "Human Rights", "Z Desk", "Alpha Desk"] }
      - { label: "Short Description", name: "description", widget: "text", hint: "2-3 sentence summary for homepage & SEO meta." }
      - { label: "Cover Image", name: "image", widget: "image", required: false, hint: "Upload from computer. 1200x800 recommended." }
      - { label: "Source", name: "source", widget: "string", required: false, hint: "e.g., Reuters, AP, BBC, The Global Desk" }
      - { label: "Body Content", name: "body", widget: "markdown", hint: "Write the full story here." }
      - { label: "Publish Date", name: "date", widget: "datetime", default: "" }

  - name: "breaking"
    label: "Breaking News"
    label_singular: "Breaking News"
    folder: "breaking"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{slug}}"
    fields:
      - { label: "Breaking Headline", name: "title", widget: "string", hint: "Very short, one line." }
      - { label: "Expiry Date & Time", name: "expires", widget: "datetime", hint: "News stops showing after this time." }
      - { label: "Priority", name: "priority", widget: "select", options: ["Normal", "High"], default: "Normal" }
      - { label: "Active", name: "active", widget: "boolean", default: true }