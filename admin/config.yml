backend:
  name: github
  repo: KhanTechZZ/theglobaldesk
  branch: main
  base_url: https://tgdnews.pages.dev
  auth_endpoint: /api/auth

logo_url: "https://tgdnews.pages.dev/Logo.png"
locale: 'en'
publish_mode: simple

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news_drafts"
    label: "📝 Drafts (Unpublished)"
    label_singular: "📝 Draft"
    description: "RSS articles waiting for your review. To PUBLISH: turn ON the '🚀 Publish' toggle below and Save."
    folder: "news"
    filter: { field: "published", value: false }
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ['imported_at', 'date', 'title']
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "🚀 Publish this article (ON = goes live)", name: "published", widget: "boolean", default: false }
      - { label: "Title (Headline)", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["World", "Asia", "Explainer", "Politics", "Economy", "Tech and AI", "Science", "Environment", "Research", "Human Rights", "Z Desk", "Alpha Desk"] }
      - { label: "Short Description", name: "description", widget: "text" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Source", name: "source", widget: "string", required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }
      - { label: "Original Publish Date", name: "date", widget: "datetime" }
      - { label: "Imported At", name: "imported_at", widget: "datetime", required: false }

  - name: "news_published"
    label: "✅ Published Articles"
    label_singular: "✅ Article"
    description: "Live articles on the site. To UNPUBLISH: turn OFF the 'Published' toggle below and Save."
    folder: "news"
    filter: { field: "published", value: true }
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ['date', 'title']
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "✅ Published (OFF = back to Drafts)", name: "published", widget: "boolean", default: true }
      - { label: "Title (Headline)", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["World", "Asia", "Explainer", "Politics", "Economy", "Tech and AI", "Science", "Environment", "Research", "Human Rights", "Z Desk", "Alpha Desk"] }
      - { label: "Short Description", name: "description", widget: "text" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Source", name: "source", widget: "string", required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }
      - { label: "Publish Date", name: "date", widget: "datetime" }

  - name: "breaking"
    label: "🚨 Breaking News"
    label_singular: "Breaking News"
    folder: "breaking"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{slug}}"
    fields:
      - { label: "Breaking Headline", name: "title", widget: "string" }
      - { label: "Expiry Date & Time", name: "expires", widget: "datetime" }
      - { label: "Priority", name: "priority", widget: "select", options: ["Normal", "High"], default: "Normal" }
      - { label: "Active", name: "active", widget: "boolean", default: true }