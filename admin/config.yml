backend:
  name: github
  repo: KhanTechZZ/theglobaldesk
  branch: main
  base_url: https://tgdnews.pages.dev
  auth_endpoint: /api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news"
    label: "News"
    folder: "news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["World", "Asia", "Explainer", "Politics", "Economy", "Tech and AI", "Science", "Environment", "Research", "Human Rights", "Z Desk", "Alpha Desk"] }
      - { label: "Source", name: "source", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "breaking"
    label: "Breaking News"
    folder: "breaking"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{slug}}"
    fields:
      - { label: "Headline", name: "title", widget: "string", hint: "Short, urgent breaking news headline" }
      - { label: "Expiry Date & Time", name: "expires", widget: "datetime", hint: "এই সময়ের পর সাইটে আর দেখাবে না" }
      - { label: "Priority", name: "priority", widget: "select", options: ["Normal", "High"], default: "Normal" }
      - { label: "Active", name: "active", widget: "boolean", default: true, hint: "Uncheck করলে সাথে সাথে সাইট থেকে সরবে" }