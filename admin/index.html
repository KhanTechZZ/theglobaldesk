<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Global Desk — Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body { font-family: 'Inter', Arial, sans-serif !important; background: #f0f4f8 !important; }
    body:not(:has(header[role="banner"])) { background: linear-gradient(135deg, #030f1e 0%, #061a33 100%) !important; }

    header[role="banner"] {
      background: #030f1e !important;
      border-bottom: 2px solid #c99a3b !important;
      padding: 0 16px !important;
      min-height: 56px !important;
      display: flex !important;
      align-items: center !important;
    }
    header[role="banner"] img, header[role="banner"] a img {
      max-height: 32px !important;
      width: auto !important;
      background: #ffffff !important;
      padding: 4px 8px !important;
      border-radius: 6px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
    }
    header[role="banner"]::after {
      content: "NEWSROOM";
      color: #c99a3b;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 2px;
      margin-left: 12px;
      padding-left: 12px;
      border-left: 1px solid rgba(201,154,59,0.3);
    }

    aside[role="navigation"], [class*="Sidebar"] {
      background: #ffffff !important;
      border-right: 1px solid #e2e8f0 !important;
      padding: 12px 8px !important;
    }
    aside[role="navigation"] a, [class*="Sidebar"] a {
      border-radius: 8px !important;
      margin: 2px 0 !important;
      padding: 10px 14px !important;
      color: #475569 !important;
      font-size: 13.5px !important;
      font-weight: 600 !important;
    }
    aside[role="navigation"] a:hover, [class*="Sidebar"] a:hover {
      background: #eaf3fb !important;
      color: #0d4f91 !important;
    }

    button[type="submit"], [class*="ToolbarButton"]:not([class*="Disabled"]), [class*="ButtonPrimary"], [class*="SaveButton"] {
      background: #c99a3b !important;
      color: #061a33 !important;
      font-weight: 800 !important;
      border-radius: 8px !important;
      border: none !important;
      padding: 5px 12px !important;
      font-size: 12px !important;
    }

    label[class*="FieldLabel"] { color: #061a33 !important; font-weight: 700 !important; font-size: 13px !important; }
    input, textarea, select { border-radius: 8px !important; border: 1.5px solid #e2e8f0 !important; padding: 10px 12px !important; font-size: 13.5px !important; }
    input:focus, textarea:focus, select:focus { border-color: #c99a3b !important; box-shadow: 0 0 0 3px rgba(201,154,59,0.1) !important; outline: none !important; }

    /* =========================================================
       🎯 TOP QUICK-ACCESS BAR (always visible)
       ========================================================= */
    .td-quick-bar {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      z-index: 99999;
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      padding: 8px 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      font-family: Arial, sans-serif;
    }

    .td-quick-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none !important;
      font-weight: 800;
      font-size: 14px;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .td-quick-btn i {
      font-size: 16px;
    }

    .td-quick-btn[data-type="drafts"] {
      background: linear-gradient(180deg, #f0f7ff, #eaf3fb);
      color: #0d4f91;
      border-color: #0d4f91;
    }
    .td-quick-btn[data-type="drafts"]:hover {
      background: #0d4f91;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(13,79,145,0.3);
    }
    .td-quick-btn[data-type="drafts"].active {
      background: #0d4f91;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(13,79,145,0.4);
    }

    .td-quick-btn[data-type="published"] {
      background: linear-gradient(180deg, #f0fdf4, #dcfce7);
      color: #16a34a;
      border-color: #16a34a;
    }
    .td-quick-btn[data-type="published"]:hover {
      background: #16a34a;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(22,163,74,0.3);
    }
    .td-quick-btn[data-type="published"].active {
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(22,163,74,0.4);
    }

    .td-quick-btn[data-type="breaking"] {
      background: linear-gradient(180deg, #fef2f2, #fee2e2);
      color: #dc2626;
      border-color: #dc2626;
    }
    .td-quick-btn[data-type="breaking"]:hover {
      background: #dc2626;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220,38,38,0.3);
    }
    .td-quick-btn[data-type="breaking"].active {
      background: #dc2626;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(220,38,38,0.4);
    }

    /* Push main content down to make room for quick bar */
    main[role="main"], [class*="MainContent"], [class*="AppMain"] {
      padding-top: 60px !important;
    }

    /* Hide the duplicate collections section on dashboard (optional) */
    .td-quick-active [class*="DashboardCollections"],
    .td-quick-active [class*="CollectionCards"] {
      display: none !important;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .td-quick-bar {
        top: 50px;
        padding: 6px 8px;
        gap: 6px;
      }
      .td-quick-btn {
        padding: 10px 8px;
        font-size: 12px;
        gap: 5px;
      }
      .td-quick-btn i { font-size: 14px; }
      header[role="banner"] { padding: 0 10px !important; min-height: 50px !important; }
      header[role="banner"] img { max-height: 28px !important; }
      header[role="banner"]::after { display: none; }
    }

    @media (max-width: 500px) {
      .td-quick-btn span { display: none; }
      .td-quick-btn { padding: 12px 6px; }
      .td-quick-btn i { font-size: 18px; }
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
  window.addEventListener('load', function() {
    if (typeof CMS === 'undefined') return;

    var h = window.h || (window.CMS && window.CMS.h);

    // =====================================================
    // PREVIEW CSS
    // =====================================================
    var previewCSS = `
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #f8fafc; font-family: Arial, sans-serif; }
      .td-preview-wrap { padding: 12px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
      .td-preview-card { background: #fff; border-radius: 8px; overflow: hidden; width: 100% !important; max-width: 320px !important; box-shadow: 0 2px 12px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; margin: 0 auto; }
      .td-preview-img-wrap { width: 100% !important; height: 180px !important; overflow: hidden; background: #e2e8f0; }
      .td-preview-img { width: 100% !important; height: 100% !important; object-fit: cover !important; display: block; }
      .td-preview-img-placeholder { width: 100%; height: 100%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 11px; font-weight: 600; }
      .td-preview-content { padding: 12px 14px 14px; }
      .td-preview-tag { display: inline-block; color: #c99a3b; font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; }
      .td-preview-title { font-family: Georgia, serif; font-size: 15px; line-height: 1.3; color: #061a33; margin: 0 0 7px; font-weight: 700; }
      .td-preview-desc { font-size: 11px; font-weight: 600; color: #4a5663; border-left: 3px solid #c99a3b; padding-left: 7px; margin: 0 0 8px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .td-preview-meta { font-size: 9px; color: #929ba5; padding-top: 7px; border-top: 1px solid #edf1f4; display: flex; flex-wrap: wrap; gap: 3px; }
      .td-preview-meta strong { color: #061a33; }
      .td-preview-breaking-card { background: #061a33; color: #fff; padding: 14px; border-radius: 8px; max-width: 320px !important; border-top: 3px solid #c51f2d; margin: 0 auto; }
      .td-preview-breaking-badge { display: inline-block; background: #c51f2d; color: #fff; padding: 3px 8px; border-radius: 3px; font-size: 9px; font-weight: 800; letter-spacing: 1.2px; margin-bottom: 7px; }
      .td-preview-breaking-card h2 { font-family: Georgia, serif; font-size: 15px; line-height: 1.3; margin: 0 0 7px; color: #fff; font-weight: 700; }
      .td-preview-breaking-meta { font-size: 10px; color: rgba(255,255,255,0.65); padding-top: 7px; border-top: 1px solid rgba(255,255,255,0.1); }
    `;
    CMS.registerPreviewStyle(previewCSS, { raw: true });

    function resolveImage(path) {
      if (!path || typeof path !== 'string') return null;
      if (/^https?:\/\//i.test(path)) return path;
      return path.startsWith('/') ? path : '/' + path;
    }

    function renderNewsPreview(props) {
      var data = props.entry.getIn(['data']).toJS();
      var imageUrl = resolveImage(data.image);
      var dateStr = data.date ? new Date(data.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Date not set';

      return h('div', { className: 'td-preview-wrap' },
        h('div', { className: 'td-preview-card' },
          h('div', { className: 'td-preview-img-wrap' },
            imageUrl ? h('img', { className: 'td-preview-img', src: imageUrl }) : h('div', { className: 'td-preview-img-placeholder' }, '🖼️ Cover Image')
          ),
          h('div', { className: 'td-preview-content' },
            data.category ? h('span', { className: 'td-preview-tag' }, data.category.toUpperCase()) : null,
            h('h1', { className: 'td-preview-title' }, data.title || 'Your headline will appear here'),
            data.description ? h('p', { className: 'td-preview-desc' }, data.description) : null,
            h('div', { className: 'td-preview-meta' },
              h('span', {}, '✍️ '), h('strong', {}, 'The Global Desk'), h('span', {}, ' · ' + dateStr),
              data.source ? h('span', {}, ' · ' + data.source) : null
            )
          )
        )
      );
    }
    CMS.registerPreviewTemplate('news', renderNewsPreview);
    CMS.registerPreviewTemplate('news_drafts', renderNewsPreview);
    CMS.registerPreviewTemplate('news_published', renderNewsPreview);

    CMS.registerPreviewTemplate('breaking', function(props) {
      var data = props.entry.getIn(['data']).toJS();
      var expiresStr = data.expires ? new Date(data.expires).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'No expiry';
      return h('div', { className: 'td-preview-wrap' },
        h('div', { className: 'td-preview-breaking-card' },
          h('span', { className: 'td-preview-breaking-badge' }, 'BREAKING'),
          h('h2', {}, data.title || 'Breaking headline'),
          h('div', { className: 'td-preview-breaking-meta' },
            '⏰ ' + expiresStr + ' · ⚡ ' + (data.priority || 'Normal') + ' · ' + (data.active ? '✅ Active' : '❌ Inactive')
          )
        )
      );
    });

    // =====================================================
    // 🎯 QUICK-ACCESS BAR (3 buttons, always visible)
    // =====================================================
    var BASE = window.location.origin + '/admin/';

    function buildQuickBar() {
      var bar = document.createElement('div');
      bar.className = 'td-quick-bar';
      bar.id = 'td-quick-bar';
      bar.innerHTML =
        '<a href="' + BASE + '#/collections/news_drafts" class="td-quick-btn" data-type="drafts">' +
          '<i class="fa-solid fa-pen-to-square"></i> <span>📝 Drafts</span>' +
        '</a>' +
        '<a href="' + BASE + '#/collections/news_published" class="td-quick-btn" data-type="published">' +
          '<i class="fa-solid fa-circle-check"></i> <span>✅ Published</span>' +
        '</a>' +
        '<a href="' + BASE + '#/collections/breaking" class="td-quick-btn" data-type="breaking">' +
          '<i class="fa-solid fa-bolt"></i> <span>🚨 Breaking</span>' +
        '</a>';

      document.body.appendChild(bar);
    }

    function updateActiveButton() {
      var hash = window.location.hash || '';
      var buttons = document.querySelectorAll('.td-quick-btn');
      buttons.forEach(function(btn) {
        btn.classList.remove('active');
      });

      if (hash.indexOf('news_drafts') !== -1) {
        document.querySelector('.td-quick-btn[data-type="drafts"]')?.classList.add('active');
      } else if (hash.indexOf('news_published') !== -1) {
        document.querySelector('.td-quick-btn[data-type="published"]')?.classList.add('active');
      } else if (hash.indexOf('breaking') !== -1) {
        document.querySelector('.td-quick-btn[data-type="breaking"]')?.classList.add('active');
      }
    }

    // Run on load
    if (document.body) buildQuickBar();
    setTimeout(updateActiveButton, 500);

    // Update active state on hash change
    window.addEventListener('hashchange', function() {
      setTimeout(updateActiveButton, 300);
    });

    // If already logged in, update state
    setTimeout(function() {
      updateActiveButton();
    }, 2000);
  });
  </script>
</body>
</html>
