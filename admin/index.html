<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Global Desk — Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #061a33;
      --gold: #c99a3b;
      --bg: #f4f7f9;
      --surface: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    /* গ্লোবাল ফন্ট ও ব্যাকগ্রাউন্ড */
    html, body, [class*="App"], [class*="Main"] {
      font-family: 'Inter', sans-serif !important;
      background-color: var(--bg) !important;
      color: var(--text) !important;
    }

    /* ডিফল্ট বেমানান সাইডবার হাইড করা */
    aside[role="navigation"], [class*="Sidebar"] {
      display: none !important;
    }
    main, [role="main"], [class*="MainContent"] {
      margin-left: 0 !important; padding: 0 !important; width: 100% !important;
    }

    /* টপ হেডার (নিউজরুম স্টাইল) */
    header[role="banner"] {
      background: var(--navy) !important;
      border-bottom: 3px solid var(--gold) !important;
      padding: 0 24px !important;
      min-height: 60px !important;
      display: flex !important;
      align-items: center !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important;
    }
    header[role="banner"] img { 
      max-height: 32px !important; background: #fff !important; 
      padding: 4px 8px !important; border-radius: 6px !important;
    }
    header[role="banner"]::after {
      content: "EDITORIAL DESK";
      color: var(--gold); font-weight: 800; font-size: 11px; letter-spacing: 2px;
      margin-left: 16px; padding-left: 16px; border-left: 1px solid rgba(201,154,59,0.4);
    }

    /* এডিটর প্যানেলকে বড় ও পরিচ্ছন্ন করা */
    [class*="EditorPane"], [class*="ControlPane"] {
      background: var(--surface) !important;
      border-radius: 12px !important;
      margin: 20px auto !important;
      max-width: 900px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04) !important;
      border: 1px solid var(--border) !important;
      padding: 30px !important;
    }

    /* ফর্মের লেবেল ও ইনপুট ফিল্ড */
    label[class*="FieldLabel"] {
      color: var(--navy) !important;
      font-weight: 700 !important;
      font-size: 13px !important;
      letter-spacing: 0.3px !important;
      margin-bottom: 8px !important;
    }
    input, textarea, select {
      border-radius: 8px !important;
      border: 1.5px solid var(--border) !important;
      padding: 12px 16px !important;
      font-size: 14px !important;
      font-family: 'Inter', sans-serif !important;
      transition: all 0.2s !important;
      background: #f8fafc !important;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--gold) !important;
      background: #fff !important;
      box-shadow: 0 0 0 3px rgba(201,154,59,0.15) !important;
      outline: none !important;
    }

    /* বড় টেক্সট এরিয়া (Markdown Editor) */
    [class*="CodeMirror"], [class*="Markdown"] {
      font-family: 'Merriweather', Georgia, serif !important;
      font-size: 16px !important;
      line-height: 1.8 !important;
      border-radius: 8px !important;
      border: 1.5px solid var(--border) !important;
      background: #fff !important;
    }
    [class*="CodeMirror"]:focus {
      border-color: var(--gold) !important;
    }

    /* বাটন স্টাইল */
    button[type="submit"], [class*="ToolbarButton"]:not([class*="Disabled"]), [class*="ButtonPrimary"] {
      background: var(--navy) !important;
      color: #fff !important;
      font-weight: 700 !important;
      border-radius: 8px !important;
      border: none !important;
      padding: 10px 24px !important;
      font-size: 14px !important;
      transition: background 0.2s !important;
    }
    button[type="submit"]:hover, [class*="ToolbarButton"]:hover, [class*="ButtonPrimary"]:hover {
      background: var(--gold) !important;
      color: var(--navy) !important;
    }

    /* লিস্ট ভিউ (ড্রাফট বা পাবলিশড লিস্ট) */
    [class*="EntryCard"], [class*="ListItem"] {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      margin-bottom: 10px !important;
      padding: 16px 20px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02) !important;
      transition: all 0.2s ease !important;
    }
    [class*="EntryCard"]:hover, [class*="ListItem"]:hover {
      border-color: var(--gold) !important;
      box-shadow: 0 4px 15px rgba(201,154,59,0.15) !important;
      transform: translateY(-2px) !important;
    }
    [class*="EntryCard"] h2, [class*="EntryCard"] h3 {
      font-family: 'Merriweather', serif !important;
      color: var(--navy) !important;
      font-size: 16px !important;
    }
  </style>
</head>
<body>
  <!-- শুধু Decap CMS লোড হবে, কোনো বাগি স্ক্রিপ্ট নেই -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
