<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Global Desk — Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body { font-family: 'Inter', Arial, sans-serif !important; background: #f0f4f8 !important; }
    body:not(:has(header[role="banner"])) { background: linear-gradient(135deg, #030f1e 0%, #061a33 100%) !important; }

    /* ========== HEADER ========== */
    header[role="banner"] {
      background: #030f1e !important;
      border-bottom: 2px solid #c99a3b !important;
      padding: 0 16px !important;
      min-height: 56px !important;
      display: flex !important;
      align-items: center !important;
    }
    header[role="banner"] img,
    header[role="banner"] a img {
      max-height: 32px !important;
      width: auto !important;
      background: #ffffff !important;
      padding: 4px 8px !important;
      border-radius: 6px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
    }
    header[role="banner"]::after {
      content: "NEWSROOM";
      color: #c99a3b;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 2px;
      margin-left: 12px;
      padding-left: 12px;
      border-left: 1px solid rgba(201,154,59,0.3);
    }

    /* ========== FLOATING VIEW STATS BUTTON ========== */
    .view-stats-float-btn {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 999999 !important;
      background: #c99a3b !important;
      color: #061a33 !important;
      padding: 11px 20px !important;
      border-radius: 30px !important;
      font-weight: 800 !important;
      font-size: 13px !important;
      text-decoration: none !important;
      box-shadow: 0 8px 24px rgba(201,154,59,0.5) !important;
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      transition: all 0.2s !important;
      border: 2px solid #061a33 !important;
    }
    .view-stats-float-btn:hover {
      transform: translateY(-3px) !important;
      background: #e5c06b !important;
    }

    /* ========== SIDEBAR ========== */
    aside[role="navigation"],
    [class*="Sidebar"] {
      background: #ffffff !important;
      border-right: 1px solid #e2e8f0 !important;
      padding: 12px 8px !important;
    }
    aside[role="navigation"] a,
    [class*="Sidebar"] a {
      border-radius: 8px !important;
      margin: 2px 0 !important;
      padding: 10px 14px !important;
      color: #475569 !important;
      font-size: 13.5px !important;
      font-weight: 600 !important;
      transition: all 0.15s ease !important;
    }
    aside[role="navigation"] a:hover,
    [class*="Sidebar"] a:hover {
      background: #eaf3fb !important;
      color: #0d4f91 !important;
    }

    /* ========== HINTS ========== */
    [class*="ControlHint"],
    .css-1j8z6y0-ControlHint,
    p[class*="ControlHint"] {
      font-size: 11px !important;
      line-height: 1.4 !important;
      color: #64748b !important;
      margin-top: 4px !important;
      margin-bottom: 0 !important;
      padding: 4px 8px !important;
      background: #f8fafc !important;
      border-radius: 4px !important;
      border-left: 2px solid #c99a3b !important;
    }

    /* ========== BUTTONS ========== */
    button[type="submit"],
    [class*="ToolbarButton"]:not([class*="Disabled"]),
    [class*="ButtonPrimary"],
    [class*="SaveButton"] {
      background: #c99a3b !important;
      color: #061a33 !important;
      font-weight: 800 !important;
      border-radius: 8px !important;
      border: none !important;
      padding: 5px 12px !important;
      font-size: 12px !important;
      box-shadow: 0 2px 8px rgba(201,154,59,0.2) !important;
    }

    /* ========== FIELDS ========== */
    label[class*="FieldLabel"] {
      color: #061a33 !important;
      font-weight: 700 !important;
      font-size: 13px !important;
      margin-bottom: 4px !important;
    }
    input, textarea, select {
      border-radius: 8px !important;
      border: 1.5px solid #e2e8f0 !important;
      padding: 10px 12px !important;
      font-size: 13.5px !important;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #c99a3b !important;
      box-shadow: 0 0 0 3px rgba(201,154,59,0.1) !important;
      outline: none !important;
    }

    /* ========== CLEAN SMALL PREVIEW ========== */
    .td-preview {
      padding: 16px;
      background: #f8fafc;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .td-preview-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }
    .td-preview-tag {
      display: inline-block;
      color: #c99a3b;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .td-preview-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.25;
      color: #061a33;
      margin: 0 0 10px;
      letter-spacing: -0.3px;
    }
    .td-preview-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
      display: block;
      background: #e2e8f0;
    }
    .td-preview-img-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      margin-bottom: 12px;
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
    }
    .td-preview-desc {
      font-size: 13px;
      font-weight: 600;
      color: #4a5663;
      border-left: 3px solid #c99a3b;
      padding-left: 10px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .td-preview-meta {
      font-size: 11px;
      color: #929ba5;
      padding-top: 10px;
      border-top: 1px solid #edf1f4;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .td-preview-body {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      line-height: 1.7;
      color: #273545;
      margin-top: 10px;
    }

    /* ========== BREAKING PREVIEW ========== */
    .td-preview-breaking {
      padding: 16px;
      background: #f8fafc;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .td-preview-breaking-card {
      background: #061a33;
      color: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 480px;
      margin: 0 auto;
      border-top: 3px solid #c51f2d;
    }
    .td-preview-breaking-badge {
      display: inline-block;
      background: #c51f2d;
      color: #fff;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }
    .td-preview-breaking-card h2 {
      font-family: Georgia, serif;
      font-size: 18px;
      line-height: 1.3;
      margin: 0 0 10px;
      color: #ffffff;
    }
    .td-preview-breaking-meta {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    /* ========== ADMIN RESPONSIVE ========== */
    @media (max-width: 768px) {
      header[role="banner"] { padding: 0 10px !important; min-height: 50px !important; }
      header[role="banner"] img { max-height: 28px !important; padding: 3px 6px !important; }
      header[role="banner"]::after { display: none; }

      .view-stats-float-btn {
        bottom: 14px !important;
        right: 14px !important;
        padding: 10px 16px !important;
        font-size: 12px !important;
      }

      [class*="Sidebar"] { padding: 8px 4px !important; }
      aside[role="navigation"] a,
      [class*="Sidebar"] a { padding: 8px 10px !important; font-size: 12.5px !important; }

      [class*="ControlHint"] { font-size: 10.5px !important; padding: 3px 6px !important; }

      button[type="submit"],
      [class*="ToolbarButton"]:not([class*="Disabled"]),
      [class*="ButtonPrimary"] {
        padding: 5px 10px !important;
        font-size: 11.5px !important;
      }

      input, textarea, select { padding: 8px 10px !important; font-size: 13px !important; }

      .td-preview-card,
      .td-preview-breaking-card { max-width: 100% !important; padding: 16px !important; }
      .td-preview-title { font-size: 20px !important; }
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.4.0/dist/decap-cms.js"></script>

  <script>
  window.addEventListener('load', function() {
    if (typeof CMS === 'undefined') return;

    // ===== FIXED: Image URL resolver (NO getAsset = NO React error) =====
    function resolveImage(path) {
      if (!path) return null;
      if (typeof path !== 'string') return null;
      if (/^https?:\/\//i.test(path)) return path;
      return path.startsWith('/') ? path : '/' + path;
    }

    // ===== NEWS PREVIEW (Small, Clean, Works) =====
    CMS.registerPreviewTemplate('news', function(props) {
      const h = props.h;
      const data = props.entry.getIn(['data']).toJS();
      const bodyWidget = props.widgetFor('body');
      const imageUrl = resolveImage(data.image);
      const dateStr = data.date
        ? new Date(data.date).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', year: 'numeric'
          })
        : 'Date not set';

      return h('div', { className: 'td-preview' },
        h('div', { className: 'td-preview-card' },
          data.category
            ? h('span', { className: 'td-preview-tag' }, data.category.toUpperCase())
            : null,
          h('h1', { className: 'td-preview-title' }, data.title || 'Your headline will appear here'),
          data.description
            ? h('p', { className: 'td-preview-desc' }, data.description)
            : null,
          imageUrl
            ? h('img', {
                className: 'td-preview-img',
                src: imageUrl,
                alt: data.title || 'Cover',
                onError: function(e) { e.target.style.display = 'none'; }
              })
            : h('div', { className: 'td-preview-img-placeholder' }, '🖼️ Cover Image'),
          h('div', { className: 'td-preview-meta' },
            h('span', {}, '✍️ The Global Desk'),
            h('span', {}, '·'),
            h('span', {}, dateStr),
            data.source ? h('span', {}, '· ' + data.source) : null
          ),
          bodyWidget
            ? h('div', { className: 'td-preview-body' }, bodyWidget)
            : h('div', { className: 'td-preview-body', style: { color: '#94a3b8', fontStyle: 'italic' } }, 'Body content will appear here...')
        )
      );
    });

    // ===== BREAKING PREVIEW =====
    CMS.registerPreviewTemplate('breaking', function(props) {
      const h = props.h;
      const data = props.entry.getIn(['data']).toJS();
      const expiresStr = data.expires
        ? new Date(data.expires).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : 'No expiry';

      return h('div', { className: 'td-preview-breaking' },
        h('div', { className: 'td-preview-breaking-card' },
          h('span', { className: 'td-preview-breaking-badge' }, 'BREAKING'),
          h('h2', {}, data.title || 'Breaking headline'),
          h('div', { className: 'td-preview-breaking-meta' },
            '⏰ ' + expiresStr + ' · ⚡ ' + (data.priority || 'Normal') + ' · ' + (data.active ? '✅ Active' : '❌ Inactive')
          )
        )
      );
    });

    CMS.registerPreviewStyle('/style.css');

    // ===== FLOATING VIEW STATS BUTTON =====
    function injectFloatBtn() {
      if (document.querySelector('.view-stats-float-btn')) return;
      var btn = document.createElement('a');
      btn.href = '/admin/views.html';
      btn.target = '_blank';
      btn.className = 'view-stats-float-btn';
      btn.innerHTML = '📊 View Stats';
      document.body.appendChild(btn);
    }
    if (document.body) injectFloatBtn();
    setInterval(injectFloatBtn, 1500);
  });
  </script>
</body>
</html>
