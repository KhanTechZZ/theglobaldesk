name: Fetch RSS News

on:
  schedule:
    # প্রতি ৪ ঘণ্টা পর পর অটোমেটিক রান হবে
    - cron: '0 */4 * * *' 
  # ব্রেকিং নিউজের সময় ম্যানুয়ালি রান করার জন্য
  workflow_dispatch: 

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install rss-parser turndown

      - name: Run fetch script
        run: node scripts/fetch-rss.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news/ breaking/ .rss-seen.json
          git commit -m "Auto-update news and breaking drafts" || exit 0
          git push